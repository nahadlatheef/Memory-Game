
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Simon Says</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-0: #0f0e13;
    --bg-1: #1a1820;
    --console: #2b2732;
    --console-hi: #38333f;
    --console-lo: #1f1c25;
    --rim: #100e14;
    --display-bg: #0b0a0d;
    --display-text: #ff8f3d;
    --display-text-dim: #4a2f18;
    --ink: #f1ede6;
    --ink-dim: #a89fb3;
    --focus: #ff8f3d;

    --green-lit: #22c55e;
    --green-dim: #123a22;
    --red-lit: #ff4757;
    --red-dim: #43151b;
    --yellow-lit: #ffd23f;
    --yellow-dim: #4a3c10;
    --blue-lit: #3b82f6;
    --blue-dim: #142944;

    --font-display: 'Silkscreen', monospace;
    --font-body: 'Space Grotesk', system-ui, -apple-system, sans-serif;

    color-scheme: dark;
  }

  :root:not([data-theme="light"]) {
    --bg-0: #0f0e13;
    --bg-1: #1a1820;
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg-0: #cfc9c0;
      --bg-1: #e4dfd6;
      --ink: #241f29;
      --ink-dim: #5c5468;
    }
  }

  :root[data-theme="light"] {
    --bg-0: #cfc9c0;
    --bg-1: #e4dfd6;
    --ink: #241f29;
    --ink-dim: #5c5468;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    min-height: 100%;
    background:
      radial-gradient(ellipse 120% 80% at 50% -10%, var(--bg-1), var(--bg-0) 60%);
    font-family: var(--font-body);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding:
      calc(env(safe-area-inset-top, 0px) + 24px)
      max(20px, env(safe-area-inset-right, 0px))
      calc(env(safe-area-inset-bottom, 0px) + 24px)
      max(20px, env(safe-area-inset-left, 0px));
  }

  .wrap {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  .title-block {
    text-align: center;
  }

  h1 {
    margin: 0;
    font-family: var(--font-display);
    font-size: clamp(28px, 8vw, 38px);
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--ink);
    text-shadow: 0 2px 0 rgba(0,0,0,0.25);
  }

  .tagline {
    margin: 8px 0 0;
    font-size: 13px;
    color: var(--ink-dim);
    letter-spacing: 0.3px;
  }

  /* ---- Console ---- */
  .console {
    position: relative;
    width: min(84vw, 360px);
    aspect-ratio: 1;
    border-radius: 50%;
    background:
      radial-gradient(circle at 32% 28%, var(--console-hi), var(--console) 45%, var(--console-lo) 100%);
    box-shadow:
      0 18px 40px rgba(0,0,0,0.45),
      0 2px 0 rgba(255,255,255,0.04) inset,
      0 -10px 24px rgba(0,0,0,0.4) inset;
    padding: min(4vw, 16px);
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: min(2.2vw, 10px);
  }

  .pad {
    border: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    position: relative;
    transition: filter 90ms ease, transform 90ms ease;
  }
  .pad:active { transform: scale(0.98); }

  .pad-green  { border-radius: 100% 4px 4px 4px; background: var(--green-dim); }
  .pad-red    { border-radius: 4px 100% 4px 4px; background: var(--red-dim); }
  .pad-yellow { border-radius: 4px 4px 4px 100%; background: var(--yellow-dim); }
  .pad-blue   { border-radius: 4px 4px 100% 4px; background: var(--blue-dim); }

  .pad.lit.pad-green  { background: var(--green-lit);  box-shadow: 0 0 26px 4px rgba(34,197,94,0.65); }
  .pad.lit.pad-red    { background: var(--red-lit);    box-shadow: 0 0 26px 4px rgba(255,71,87,0.65); }
  .pad.lit.pad-yellow { background: var(--yellow-lit); box-shadow: 0 0 26px 4px rgba(255,210,63,0.65); }
  .pad.lit.pad-blue   { background: var(--blue-lit);   box-shadow: 0 0 26px 4px rgba(59,130,246,0.65); }

  .pad:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: -3px;
    z-index: 2;
  }

  @media (hover: hover) {
    .pad-green:hover  { filter: brightness(1.15); }
    .pad-red:hover    { filter: brightness(1.15); }
    .pad-yellow:hover { filter: brightness(1.15); }
    .pad-blue:hover   { filter: brightness(1.15); }
  }

  /* center display */
  .hub {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 34%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--console-hi), var(--rim) 75%);
    box-shadow: 0 6px 14px rgba(0,0,0,0.5), 0 0 0 6px var(--rim);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 3;
  }

  .hub-screen {
    width: 76%;
    aspect-ratio: 1.7;
    background: var(--display-bg);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.7);
  }

  .hub-readout {
    font-family: var(--font-display);
    font-size: clamp(16px, 5vw, 22px);
    color: var(--display-text);
    text-shadow: 0 0 8px rgba(255,143,61,0.65);
    letter-spacing: 1px;
  }

  /* ---- controls row ---- */
  .controls {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  .btn {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 14px;
    color: var(--bg-0);
    background: var(--display-text);
    border: none;
    border-radius: 999px;
    padding: 11px 22px;
    cursor: pointer;
    letter-spacing: 0.2px;
    transition: transform 90ms ease, filter 120ms ease;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: translateY(1px) scale(0.99); }
  .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .btn:disabled { opacity: 0.5; cursor: default; }

  .status-row {
    display: flex;
    justify-content: space-between;
    width: 100%;
    max-width: 300px;
    font-size: 12px;
    color: var(--ink-dim);
    letter-spacing: 0.3px;
  }

  .status-row strong {
    color: var(--ink);
    font-weight: 600;
  }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    .pad, .btn { transition: none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="title-block">
      <h1>SIMON SAYS</h1>
      <p class="tagline">Watch the pattern. Repeat it back. Don't blink.</p>
    </div>

    <div class="console" id="console">
      <button class="pad pad-green"  data-color="green"  aria-label="Green"  tabindex="0"></button>
      <button class="pad pad-red"    data-color="red"    aria-label="Red"    tabindex="0"></button>
      <button class="pad pad-yellow" data-color="yellow" aria-label="Yellow" tabindex="0"></button>
      <button class="pad pad-blue"   data-color="blue"   aria-label="Blue"   tabindex="0"></button>

      <div class="hub" aria-hidden="true">
        <div class="hub-screen">
          <div class="hub-readout" id="readout">00</div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="btn" id="startBtn">Start</button>
    </div>

    <div class="status-row">
      <span id="statusText">Press Start to play</span>
      <span>Best: <strong id="bestScore">0</strong></span>
    </div>

    <div class="sr-only" role="status" aria-live="polite" id="liveRegion"></div>
  </div>

<script>
(function () {
  "use strict";

  var COLORS = ["green", "red", "yellow", "blue"];
  var FREQ = { green: 329.63, red: 277.18, yellow: 220.0, blue: 164.81 };
  var KEY_MAP = { "1": "green", "2": "red", "3": "yellow", "4": "blue",
                  "q": "green", "w": "red", "a": "yellow", "s": "blue" };

  var pads = {};
  COLORS.forEach(function (c) {
    pads[c] = document.querySelector('.pad-' + c);
  });

  var readout = document.getElementById("readout");
  var startBtn = document.getElementById("startBtn");
  var statusText = document.getElementById("statusText");
  var bestScoreEl = document.getElementById("bestScore");
  var liveRegion = document.getElementById("liveRegion");

  var sequence = [];
  var playerIndex = 0;
  var level = 0;
  var accepting = false;
  var playing = false;
  var best = 0;

  var STORAGE_KEY = "simon-says-best-score";

  try {
    var saved = localStorage.getItem(STORAGE_KEY);
    if (saved !== null) best = parseInt(saved, 10) || 0;
  } catch (e) { /* storage unavailable, ignore */ }
  bestScoreEl.textContent = String(best);

  var audioCtx = null;
  function ctx() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
    }
    return audioCtx;
  }

  function tone(color, duration) {
    try {
      var ac = ctx();
      var osc = ac.createOscillator();
      var gain = ac.createGain();
      osc.type = "triangle";
      osc.frequency.value = FREQ[color];
      gain.gain.setValueAtTime(0.0001, ac.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.28, ac.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + duration / 1000);
      osc.connect(gain);
      gain.connect(ac.destination);
      osc.start();
      osc.stop(ac.currentTime + duration / 1000 + 0.02);
    } catch (e) { /* audio unavailable, ignore */ }
  }

  function buzz() {
    try {
      var ac = ctx();
      var osc = ac.createOscillator();
      var gain = ac.createGain();
      osc.type = "sawtooth";
      osc.frequency.value = 90;
      gain.gain.setValueAtTime(0.0001, ac.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.25, ac.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + 0.5);
      osc.connect(gain);
      gain.connect(ac.destination);
      osc.start();
      osc.stop(ac.currentTime + 0.52);
    } catch (e) { /* audio unavailable, ignore */ }
  }

  function setReadout(text) { readout.textContent = text; }

  function announce(text) {
    statusText.textContent = text;
    liveRegion.textContent = text;
  }

  function padSpeed() {
    if (level > 14) return 260;
    if (level > 9) return 330;
    if (level > 5) return 400;
    return 480;
  }

  function litOn(color) {
    pads[color].classList.add("lit");
    tone(color, padSpeed() * 0.7);
  }
  function litOff(color) {
    pads[color].classList.remove("lit");
  }

  function flashAll(times, cb) {
    var count = 0;
    var iv = setInterval(function () {
      COLORS.forEach(function (c) {
        pads[c].classList.toggle("lit");
      });
      count++;
      if (count >= times * 2) {
        clearInterval(iv);
        COLORS.forEach(function (c) { pads[c].classList.remove("lit"); });
        if (cb) cb();
      }
    }, 120);
  }

  function playSequence() {
    accepting = false;
    playerIndex = 0;
    var i = 0;
    var speed = padSpeed();
    setReadout(pad2(level));
    announce("Watch the sequence: level " + level);

    var iv = setInterval(function () {
      if (i > 0) litOff(sequence[i - 1]);
      if (i >= sequence.length) {
        clearInterval(iv);
        setTimeout(function () {
          accepting = true;
          announce("Your turn — repeat the pattern");
        }, speed * 0.4);
        return;
      }
      litOn(sequence[i]);
      i++;
    }, speed);
  }

  function pad2(n) {
    n = Math.max(0, n);
    return (n < 10 ? "0" : "") + String(n);
  }

  function nextRound() {
    level++;
    sequence.push(COLORS[Math.floor(Math.random() * COLORS.length)]);
    setTimeout(playSequence, 500);
  }

  function startGame() {
    ctx(); // unlock audio on user gesture
    sequence = [];
    level = 0;
    playing = true;
    startBtn.textContent = "Restart";
    nextRound();
  }

  function gameOver() {
    playing = false;
    accepting = false;
    buzz();
    flashAll(3);
    if (level - 1 > best) {
      best = level - 1;
      bestScoreEl.textContent = String(best);
      try { localStorage.setItem(STORAGE_KEY, String(best)); } catch (e) {}
    }
    setReadout("--");
    announce("Game over. You reached level " + (level - 1) + ". Press Start to try again.");
    startBtn.textContent = "Start";
  }

  function handlePress(color) {
    if (!accepting || !playing) return;
    litOn(color);
    setTimeout(function () { litOff(color); }, 180);

    if (color !== sequence[playerIndex]) {
      accepting = false;
      gameOver();
      return;
    }

    playerIndex++;
    if (playerIndex === sequence.length) {
      accepting = false;
      setTimeout(nextRound, 600);
    }
  }

  COLORS.forEach(function (c) {
    pads[c].addEventListener("click", function () { handlePress(c); });
  });

  document.addEventListener("keydown", function (e) {
    var key = e.key.toLowerCase();
    if (KEY_MAP[key]) {
      handlePress(KEY_MAP[key]);
    }
  });

  startBtn.addEventListener("click", startGame);

  announce("Press Start to play");
})();
</script>
</body>
</html>
